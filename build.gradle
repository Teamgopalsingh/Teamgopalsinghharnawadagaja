// ==============================================================================
// TEAM GOPAL SINGH - HARNAWADA GAJA (GRADLE BUILD CONFIGURATION)
// Package: com.teamgopalsingh.harnawadagaja
// Unified Project & App Level Build Specifications
// ==============================================================================

// ------------------------------------------------------------------------------
// SECTION 1: PROJECT-LEVEL GRADLE CONFIGURATION
// ------------------------------------------------------------------------------
buildscript {
    ext {
        kotlin_version = '1.9.22'
        gradle_plugin_version = '8.2.2'
        navigation_version = '2.7.7'
        supabase_version = '2.1.3'
        coroutines_version = '1.8.0'
        ktor_version = '2.3.8'
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:$gradle_plugin_version"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "androidx.navigation:navigation-safe-args-gradle-plugin:$navigation_version"
        classpath "com.google.gms:google-services:4.4.1"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

// ------------------------------------------------------------------------------
// SECTION 2: APP-LEVEL GRADLE CONFIGURATION
// ------------------------------------------------------------------------------
apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'
apply plugin: 'androidx.navigation.safeargs.kotlin'
apply plugin: 'com.google.gms.google-services'

android {
    namespace 'com.teamgopalsingh.harnawadagaja'
    compileSdk 34

    defaultConfig {
        applicationId "com.teamgopalsingh.harnawadagaja"
        minSdk 21
        targetSdk 34
        versionCode 100
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Enable MultiDex support for API levels < 21 compatibility & large dependency trees
        multiDexEnabled true

        // Vector drawable support for older Android releases
        vectorDrawables.useSupportLibrary = true

        // Manifest placeholders for dynamic configuration
        manifestPlaceholders = [
            appDomain: "teamgopalsingh.org",
            schemeName: "teamgopalsingh"
        ]
    }

    // Release Signing Configuration using Secure Environment Variables
    signingConfigs {
        release {
            def keystoreFilePath = System.getenv("KEYSTORE_FILE") ?: "keystore/release-key.jks"
            def keystorePass = System.getenv("KEYSTORE_PASSWORD") ?: "TeamGopalSingh@2026"
            def keyAliasName = System.getenv("KEY_ALIAS") ?: "team_gopalsingh_alias"
            def keyPass = System.getenv("KEY_PASSWORD") ?: "TeamGopalSingh@2026"

            if (file(keystoreFilePath).exists()) {
                storeFile file(keystoreFilePath)
                storePassword keystorePass
                keyAlias keyAliasName
                keyPassword keyPass
                v1SigningEnabled true
                v2SigningEnabled true
            } else {
                println("WARNING: Release keystore file not found at " + keystoreFilePath + ". Falling back to debug signing for testing.")
                storeFile file("${System.properties['user.home']}/.android/debug.keystore")
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
        debug {
            storeFile file("${System.properties['user.home']}/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release

            buildConfigField "String", "SUPABASE_URL", '"https://xyzprojectid.supabase.co"'
            buildConfigField "String", "SUPABASE_ANON_KEY", '"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."'
            buildConfigField "String", "OFFICIAL_PORTAL_URL", '"https://teamgopalsingh.org"'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
            versionNameSuffix "-DEBUG"
            signingConfig signingConfigs.debug

            buildConfigField "String", "SUPABASE_URL", '"https://xyzprojectid.supabase.co"'
            buildConfigField "String", "SUPABASE_ANON_KEY", '"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."'
            buildConfigField "String", "OFFICIAL_PORTAL_URL", '"https://teamgopalsingh.org"'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += [
            "-opt-in=kotlinx.coroutines.ExperimentalCoroutinesApi",
            "-opt-in=kotlin.RequiresOptIn"
        ]
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    packagingOptions {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/license.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/notice.txt',
                'META-INF/ASL2.0',
                'META-INF/*.kotlin_module'
            ]
        }
    }
}

// ------------------------------------------------------------------------------
// SECTION 3: DEPENDENCIES
// ------------------------------------------------------------------------------
dependencies {
    // MultiDex Support
    implementation 'androidx.multidex:multidex:2.0.1'

    // AndroidX Core & UI Components
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // Jetpack Architecture Components
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.7.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.7.0"
    implementation "androidx.navigation:navigation-fragment-ktx:$navigation_version"
    implementation "androidx.navigation:navigation-ui-ktx:$navigation_version"

    // Kotlin Coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutines_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-play-services:$coroutines_version"

    // Supabase Kotlin Client (Auth, Database, Storage, Realtime)
    implementation "io.github.jan-tennert.supabase:postgrest-kt:$supabase_version"
    implementation "io.github.jan-tennert.supabase:gotrue-kt:$supabase_version"
    implementation "io.github.jan-tennert.supabase:storage-kt:$supabase_version"
    implementation "io.github.jan-tennert.supabase:realtime-kt:$supabase_version"

    // Ktor Engine for Networking
    implementation "io.ktor:ktor-client-android:$ktor_version"
    implementation "io.ktor:ktor-client-core:$ktor_version"
    implementation "io.ktor:ktor-client-content-negotiation:$ktor_version"
    implementation "io.ktor:ktor-serialization-kotlinx-json:$ktor_version"

    // Google Play Services Location (For Geo-tagging Complaints)
    implementation 'com.google.android.gms:play-services-location:21.1.0'

    // Firebase Cloud Messaging (Push Notifications)
    implementation platform('com.google.firebase:firebase-bom:32.7.2')
    implementation 'com.google.firebase:firebase-messaging-ktx'

    // Image Loading & Compression
    implementation 'io.coil-kt:coil:2.6.0'

    // Unit & UI Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
